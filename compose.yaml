name: transport-kt02
services:
  db:
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    profiles: [dev, test]
    environment:
      POSTGRES_USER: kt02
      POSTGRES_PASSWORD: kt02_local_demo
      POSTGRES_DB: transport
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kt02 -d transport']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kt02_pgdata:/var/lib/postgresql/data
volumes:
  kt02_pgdata:
