global
    maxconn 64
defaults
    mode tcp
    timeout connect 2s
    timeout client 3m
    timeout server 3m
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
listen writes
    bind 127.0.0.1:55404
    server primary primary:5432 check resolvers docker init-addr last,libc,none
listen reports
    bind 127.0.0.1:55405
    server replica replica:5432 check resolvers docker init-addr last,libc,none
