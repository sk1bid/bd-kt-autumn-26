listen_addresses = '*'
hba_file = '/work/deploy/kt04/pg_hba.conf'
unix_socket_directories = '/var/run/postgresql'
ssl = on
ssl_cert_file = '/run/kt04/server.crt'
ssl_key_file = '/run/kt04/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

wal_level = replica
max_wal_senders = 6
max_replication_slots = 4
max_slot_wal_keep_size = '512MB'
hot_standby = on
