name: transport-kt05
services:
  mongo:
    image: mongo:8.0
    volumes:
      - data:/data/db
      - ../../mongo/kt05:/examples:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  data:
